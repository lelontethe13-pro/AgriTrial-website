<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriTrial OS — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1F3864 0%, #2E74B5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            color: #1F3864;
            font-weight: bold;
        }

        .logo p {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }

        .logo .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2E74B5;
        }

        .role-select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            background: white;
            outline: none;
            cursor: pointer;
        }

        .role-select:focus {
            border-color: #2E74B5;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #1F3864;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #2E74B5;
        }

        .divider {
            text-align: center;
            color: #bbb;
            font-size: 13px;
            margin: 20px 0;
        }

        .hint {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 24px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: #f0f4fa;
            color: #2E74B5;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="logo">
            <div class="icon">🌱</div>
            <h1>AgriTrial OS</h1>
            <p>Act 36 of 1947 — Group 3 Biostimulant Compliance</p>
        </div>

        <form method="POST" action="/login">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username"
                       placeholder="e.g. farmer_jan"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <div class="form-group">
                <label>Login As</label>
                <select name="role" class="role-select">
                    <option value="farmer">🧑‍🌾 Farmer / Field Observer</option>
                    <option value="load_controller">📋 Load Controller</option>
                    <option value="dalrrd">🏛️ DALRRD Inspector</option>
                    <option value="investor">💼 Investor</option>
                    <option value="researcher">🔬 Researcher (SU ARISE / UWC)</option>
                    <option value="admin">⚙️ System Admin</option>
                </select>
            </div>

            <button type="submit" class="login-btn">
                Sign In →
            </button>

        </form>

        <div class="hint">
            Cape Winelands Cooperative | IFS140 Capstone 2026
            <br>
            <span class="badge">🔒 Prototype — No verification required</span>
        </div>

    </div>

</body>
</html>
